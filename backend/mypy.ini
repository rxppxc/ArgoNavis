# Verificador de tipos del backend (2026-11-22). Lo corre la CI antes de las pruebas:
#   venv\Scripts\python -m mypy app
# Encuentra lo que el lint no ve: un valor que puede ser None usado como si no, un argumento
# del tipo equivocado, un atributo que no existe. Al empezar había 111 avisos; ninguno era una
# falla en producción, pero varios dependían de que el código de antes ya lo hubiera validado.
[mypy]
python_version = 3.12
# Como Linux, igual que la CI y el servidor (2026-11-23): corrido en Windows no veía lo que en
# Linux sí falla. Lo que es solo de Windows va bajo `if sys.platform == "win32"` (mypy lo salta).
platform = linux
plugins = pydantic.mypy
# También dentro de las funciones sin anotar.
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
# Las librerías sin tipos (reportlab, ldap3, slowapi, python-magic…) se toman como Any. Los
# «stubs» de reportlab no se usan: sus avisos eran de los stubs, no del código.
ignore_missing_imports = True
