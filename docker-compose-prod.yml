# Nombre fijo del proyecto: los volúmenes se llaman argonavis_* aunque cambie la
# carpeta donde se despliega (sin esto, Docker los nombra según la carpeta).
name: argonavis

# Lo mismo para los tres contenedores (2026-11-22). Si alguien logra ejecutar algo dentro
# de uno, no es root, no tiene privilegios del sistema ni puede conseguirlos, y no puede
# cambiar lo que trae la imagen. Lo que cada uno sí escribe va en un volumen o en un tmpfs
# (memoria) de su servicio. Lo revisan tests/test_contenedores.py, la integración continua
# (que levanta esta misma pila) y verificar-despliegue.sh.
x-endurecido: &endurecido
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  postgres_db:
    <<: *endurecido
    # Versión exacta (2026-11-10): «postgres:15-alpine» podía cambiar de versión
    # menor en cada pull. Dentro de la 15 los datos sirven igual; para actualizar,
    # cambia la etiqueta (y la del flujo de CI, .github/workflows/ci.yml).
    # 15.20 (2026-11-22): corrige 43 vulnerabilidades; no pide reconstruir ninguno de
    # nuestros índices (son B-tree de columnas con largo).
    # En un servidor nuevo, la 18 (POSTGRES_IMAGEN y POSTGRES_VOLUMEN en el .env, las dos
    # juntas; README → PostgreSQL 18): la 15 se queda sin soporte en noviembre de 2027.
    image: ${POSTGRES_IMAGEN:-postgres:15.20-alpine3.24}
    container_name: argonavis_postgres
    restart: always
    # El usuario postgres de la imagen Alpine, desde el principio: la imagen lo admite y
    # así ni el arranque corre como root. Los datos del volumen ya son suyos.
    user: "70:70"
    networks: [datos]
    tmpfs:
      - /run/postgresql:uid=70,gid=70,mode=3775,size=1m   # el socket
      - /tmp:size=64m
    # Límites de cada contenedor (revisión de recursos del 2026-11-10). Sin ellos, uno
    # que se desboca se lleva a los demás: sin memoria, el kernel mata al proceso más
    # grande de la VM, que suele ser PostgreSQL. Con ellos, Docker corta solo dentro del
    # contenedor que se pasó, y "restart: always" (o uvicorn, con sus procesos) lo
    # levanta. Se ajustan en el .env al tamaño de la VM (README → Producción → Recursos);
    # verificar-despliegue.sh muestra el uso de cada uno contra su límite.
    mem_limit: ${POSTGRES_MEMORIA:-1g}
    pids_limit: 300            # un proceso por conexión: la app abre como mucho 30
    shm_size: 256m             # los 64 MB de Docker se quedan cortos en las consultas en paralelo
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # La 18 guarda los datos en otra carpeta y no abre los de la 15: lleva su propio volumen.
      - ${POSTGRES_VOLUMEN:-postgres_data:/var/lib/postgresql/data}
    ports:
      # Solo accesible desde el propio servidor (psql/pg_dump locales o docker exec).
      # El backend le habla por la red interna de Docker; publicarlo en 0.0.0.0
      # exponía la BD a toda la red sin necesidad.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    <<: *endurecido
    networks: [default, datos]
    build: ./backend
    # Con nombre fijo: así se puede guardar y llevar a un servidor sin internet
    # (empaquetar-sin-internet.sh y docker compose up --no-build).
    image: argonavis-backend:latest
    container_name: argonavis_backend
    restart: always
    # Memoria medida el 2026-11-10 con 100 usuarios (tests/carga.py): ~150 MB por proceso
    # de uvicorn y ~110 MB el maestro, ~410 MB en total; 1 GB deja margen para envíos y
    # exportaciones. Con más UVICORN_WORKERS, ~200 MB más por proceso. CPU: tantos núcleos
    # como procesos si la VM tiene más (en una de 2 núcleos, 1.5), para que PostgreSQL y
    # nginx tengan CPU aunque el backend esté a tope.
    mem_limit: ${BACKEND_MEMORIA:-1g}
    cpus: ${BACKEND_CPUS:-2}
    pids_limit: 512            # cuenta también los hilos (bcrypt, PDF, AD, subidas)
    # Sin "ports": el backend solo es accesible por la red interna de Docker, a
    # través de nginx (servicio frontend, /api/). Por eso uvicorn puede confiar
    # en los encabezados X-Forwarded-* (ver docker-entrypoint.sh).
    environment:
      - APP_NAME=ARGO NAVIS - SNM
      - APP_ENV=production
      # Los logs van a la salida de Docker, que los guarda y rota (ver "logging"), y además
      # (2026-11-22) a un archivo por día en un volumen: la de Docker se borra cada vez que
      # un despliegue recrea el contenedor. Con la hora de Panamá (EST5: UTC-5, sin verano).
      - LOG_NIVEL=${LOG_NIVEL:-INFO}
      - LOG_CARPETA=/app/registros
      - LOG_DIAS=${LOG_DIAS:-90}
      - TZ=EST5
      # Procesos de la API. Cada uno abre hasta 15 conexiones a PostgreSQL (BD_POOL +
      # BD_POOL_EXTRA), y el servidor admite 100: con más de 4, bajar BD_POOL_EXTRA.
      - UVICORN_WORKERS=${UVICORN_WORKERS:-2}
      - SECRET_KEY=${SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - SESION_MAXIMA_HORAS=${SESION_MAXIMA_HORAS:-12}
      - ALGORITHM=HS256
      # La aplicación entra con su propia cuenta, sin poder crear ni cambiar tablas
      # y con la bitácora solo para agregar (backend/app/infrastructure/permisos_bd.py).
      # La dueña (POSTGRES_USER) solo migra: el entrypoint borra su dirección antes de
      # levantar uvicorn.
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_APP_USER:-argonavis_app}:${POSTGRES_APP_PASSWORD:?Falta POSTGRES_APP_PASSWORD en el .env}@postgres_db:5432/${POSTGRES_DB}
      - MIGRACIONES_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB}
      - LDAP_HOST=${LDAP_HOST}
      - LDAP_PORT=${LDAP_PORT:-389}
      - LDAP_USAR_SSL=${LDAP_USAR_SSL:-false}
      - LDAP_STARTTLS=${LDAP_STARTTLS:-false}
      - LDAP_CA_CERT=${LDAP_CA_CERT:-}
      - LDAP_BASE_DN=${LDAP_BASE_DN}
      - LDAP_BIND_USER=${LDAP_BIND_USER}
      - LDAP_BIND_PASSWORD=${LDAP_BIND_PASSWORD}
      - LDAP_TIMEOUT=10
      - LDAP_ALLOWED_OU=
      - STORAGE_PATH=/app/storage/documentos
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT:-25}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_USAR_SSL=${MAIL_USAR_SSL:-false}
      - MAIL_STARTTLS=${MAIL_STARTTLS:-false}
      - MAIL_CA_CERT=${MAIL_CA_CERT:-}
      - MAIL_FROM=${MAIL_FROM}
      - MAIL_FROM_NAME=ARGO NAVIS - SNM
      - FRONTEND_URL=${APP_URL}
      - APP_URL=${APP_URL}
      # Dirección pública de la verificación del QR, cuando la DTI la publique (README).
      - URL_VERIFICACION_PUBLICA=${URL_VERIFICACION_PUBLICA:-}
      - LIMITE_VERIFICACIONES_POR_MINUTO=30
      - LIMITE_ENVIOS_POR_HORA=30
      # Autorizaciones Marítimas
      - CORREO_UCVMM=${CORREO_UCVMM:-}
      - PLAZO_CORRECCION_DIAS=3        # 72 h para corregir
      - DIAS_GRACIA_FINALIZACION=2     # 72 h desde que empieza el día de la operación
      # Recargo (B/.) por atención fuera del horario laboral (0 = sin recargo).
      - COSTO_FUERA_DE_HORARIO=${COSTO_FUERA_DE_HORARIO:-20.00}
      - VENCIMIENTOS_INTERVALO_MINUTOS=15
      # Cuentas locales (sin AD), p. ej. para los usuarios de las agencias navieras.
      - PERMITIR_LOGIN_LOCAL=${PERMITIR_LOGIN_LOCAL:-false}
      # Freno del login del AD: ajustar a la política de bloqueo del dominio.
      - LOGIN_AD_MAX_FALLOS=${LOGIN_AD_MAX_FALLOS:-3}
      - LOGIN_AD_MINUTOS_ESPERA=${LOGIN_AD_MINUTOS_ESPERA:-30}
    volumes:
      - documentos:/app/storage/documentos
      # Los archivos de un envío mientras llegan (hasta 365 MB). En un volumen, o sea en el
      # disco: en un tmpfs contarían para la memoria del contenedor.
      - temporales_backend:/tmp
      - registros:/app/registros
      # La CA interna del SNM, para el TLS con el Active Directory y con el correo
      # (LDAP_CA_CERT y MAIL_CA_CERT). La «z» es para SELinux, si Docker lo usa.
      - ./certificados/ca:/certificados/ca:ro,z
    depends_on:
      postgres_db:
        condition: service_healthy
    healthcheck:
      # python está garantizado en la imagen; curl no viene en python:3.12-slim.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    <<: *endurecido
    build: ./frontend
    image: argonavis-frontend:latest
    container_name: argonavis_frontend
    restart: always
    mem_limit: ${FRONTEND_MEMORIA:-256m}
    pids_limit: 200
    networks: [default]        # sin «datos»: nginx no alcanza a PostgreSQL
    environment:
      TZ: EST5                 # la hora de Panamá en los accesos, y el día de cada archivo
      # HTTPS (README → HTTPS): con true, el certificado de certificados/https; el 80 solo
      # redirige al nombre de APP_URL. Lo decide frontend/nginx/elegir-modo.sh al arrancar.
      USAR_HTTPS: ${USAR_HTTPS:-false}
      APP_URL: ${APP_URL}
    ports:
      - "80:8080"              # sin root, nginx escucha en el 8080 (frontend/nginx)
      - "443:8443"             # con HTTPS; sin él, ahí no contesta nadie
    volumes:
      - temporales_nginx:/var/cache/nginx   # cada envío, mientras llega (ver temporales_backend)
      - registros_nginx:/var/log/argonavis  # un archivo de accesos por día (los borra vigilar.py)
      - ./certificados/https:/certificados:ro,z
    tmpfs:
      - /run:uid=101,gid=101,mode=755,size=1m   # nginx.pid y dónde escucha
    depends_on:
      - backend
    healthcheck:
      # 127.0.0.1 explícito: "localhost" resuelve primero a ::1 (IPv6) dentro
      # del contenedor y nginx solo escucha en IPv4 → falso "unhealthy".
      # El 8081 es solo para esto (frontend/nginx.conf): con HTTPS, el 8080 redirige.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default: {}                  # nginx y el backend (y la salida del backend al AD y al correo)
  datos:                       # el backend y PostgreSQL, y nadie más
    ipam:
      config:
        # Chica y a propósito: sin esto Docker toma un /16 de 172.x y, si coincide con una
        # red del SNM o de la VPN, el servidor deja de alcanzarla.
        - subnet: ${RED_DATOS:-172.31.255.240/28}

volumes:
  postgres_data:
  postgres_18:                 # con POSTGRES_VOLUMEN (.env.example)
  documentos:
  temporales_backend:
  temporales_nginx:
  registros:
  registros_nginx:
