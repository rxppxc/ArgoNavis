# ─────────────────────────────────────────────────────────────────────────────
# PLANTILLA PARA LA DTI — publicar en internet SOLO la verificación del QR de
# ARGO NAVIS (2026-11-14). No la usa la imagen de Docker: esa usa nginx.conf.
#
# Para que el QR del PDF se pueda escanear desde cualquier celular, sin VPN, sin
# abrir el resto del sistema. Va en el proxy que la DTI tenga en la DMZ (o donde
# publique servicios), con un nombre propio y HTTPS, y reenvía al nginx interno de
# ARGO NAVIS solo esto:
#   - la página de verificación     /verificar/{código}
#   - lo que esa página carga       /assets/…, /images/…, /tema-inicial.js, /favicon.svg
#   - dos rutas de solo lectura     GET /api/v1/verificacion/{código}
#                                   GET /api/v1/verificacion/{código}/autorizacion.pdf
# Todo lo demás (el login, las bandejas, los documentos del expediente y el resto de
# la API) responde 404 aquí: desde internet no se llega a nada más.
#
# Pasos (README → «Verificación pública del QR»):
#   1. Reemplazar verificar.EJEMPLO.gob.pa, los certificados y la IP interna.
#   2. En el nginx interno (frontend/nginx.conf), confiar en este proxy para la IP
#      real del cliente: «set_real_ip_from <IP de este proxy>; real_ip_header X-Real-IP;».
#      Sin eso, la bitácora y el tope por IP verían a todos como este proxy.
#   3. En el .env del servidor: URL_VERIFICACION_PUBLICA=https://verificar.EJEMPLO.gob.pa
#      y reiniciar el backend: los PDF que se descarguen desde entonces llevan el QR
#      a esta dirección (los ya impresos siguen con la interna).
# ─────────────────────────────────────────────────────────────────────────────

# Freno por IP, además del de la aplicación (que es por proceso).
limit_req_zone $binary_remote_addr zone=argonavis_verificacion:10m rate=30r/m;

server {
    listen 80;
    server_name verificar.EJEMPLO.gob.pa;
    server_tokens off;
    # Sin HTTPS no se publica: el PDF lleva los datos de los pasajeros.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;   # nginx anterior a 1.25: «listen 443 ssl http2;» y sin esta línea
    server_name verificar.EJEMPLO.gob.pa;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/verificar.EJEMPLO.gob.pa.crt;
    ssl_certificate_key /etc/nginx/certs/verificar.EJEMPLO.gob.pa.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Solo se lee: nada de POST, PUT ni DELETE desde internet.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # El nginx interno de ARGO NAVIS (el contenedor frontend), por IP.
    set $argonavis http://IP-INTERNA-DE-ARGO-NAVIS:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_hide_header X-Powered-By;
    client_max_body_size 1k;

    # La página de verificación (la de la aplicación, que se arma en el navegador).
    location ~ "^/verificar/[A-Za-z0-9_-]{1,64}$" {
        limit_req zone=argonavis_verificacion burst=20 nodelay;
        proxy_pass $argonavis;
    }

    # Lo que esa página carga.
    location /assets/ { proxy_pass $argonavis; }
    location /images/ { proxy_pass $argonavis; }
    location = /tema-inicial.js { proxy_pass $argonavis; }
    location = /favicon.svg { proxy_pass $argonavis; }
    location = /robots.txt { proxy_pass $argonavis; }

    # Las dos rutas de solo lectura de la verificación: el resumen y el PDF.
    location ~ "^/api/v1/verificacion/[A-Za-z0-9_-]{1,64}(/autorizacion\.pdf)?$" {
        limit_req zone=argonavis_verificacion burst=10 nodelay;
        proxy_pass $argonavis;
    }

    # Todo lo demás no existe desde internet.
    location / { return 404; }
}
