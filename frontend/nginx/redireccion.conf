# Con HTTPS, el 80 solo lleva al mismo lugar por HTTPS, siempre con el nombre de APP_URL (lo
# pone elegir-modo.sh): por la IP, el certificado no coincide y el navegador advierte.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;   # sin ella, nginx no escribe el archivo de accesos del día
    access_log /var/log/nginx/access.log main;
    access_log /var/log/argonavis/acceso-$dia.log main;
    return 301 https://NOMBRE$request_uri;
}
