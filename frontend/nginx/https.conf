# Dónde escucha nginx por HTTPS (USAR_HTTPS=true). Docker publica el 8443 en el 443.
# Sin HTTP/2 a propósito: un envío rechazado por grande se corta distinto, y el formulario no
# alcanzaría a leer el motivo (el 413).
listen 8443 ssl;

# El certificado del servidor con sus intermedios, en ese orden, y su clave privada sin
# contraseña: certificados/https del servidor (README → HTTPS).
ssl_certificate     /certificados/argonavis.crt;
ssl_certificate_key /certificados/argonavis.key;

# Solo TLS 1.2 y 1.3. En 1.2, cifrados autenticados y con secreto hacia adelante: quien
# consiga la clave privada no puede descifrar lo que haya grabado antes.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:argonavis:5m;
ssl_session_timeout 1h;
ssl_session_tickets off;
