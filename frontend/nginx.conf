server {
    listen 80;
    server_name localhost;
    server_tokens off;   # sin la versión de nginx en errores y cabeceras

    # Cabeceras de seguridad. Ojo: nginx solo las hereda a los location que NO
    # tienen add_header propio (por eso index.html usa "expires" y /assets/ las repite).
    #   - Nadie puede meter el sistema en un iframe (clickjacking).
    #   - El navegador no adivina tipos de archivo.
    #   - Las URL internas (p. ej. el código del QR) no salen como Referer.
    # Con HTTPS, agregar también Strict-Transport-Security (ver README).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Sistema interno: que ningún buscador ni rastreador lo indexe (robots.txt dice lo mismo).
    add_header X-Robots-Tag "noindex, nofollow" always;
    # Solo corre código propio de ARGO NAVIS: sin scripts en línea, sin eval y sin
    # recursos de otros sitios. Es la barrera ante un XSS (el token vive en
    # localStorage). Igual que _CSP en backend/app/main.py.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Compresión: los bundles JS/CSS de Vite bajan ~70% de peso transferido.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # Los assets de Vite llevan hash en el nombre (index-a1b2c3.js): si el
    # contenido cambia, cambia el nombre — cachearlos "para siempre" es seguro.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri /index.html;
        # index.html no lleva hash en el nombre — si el navegador la cachea,
        # puede seguir apuntando al bundle JS de un deploy anterior. Los
        # archivos bajo /assets/ sí llevan hash y cachean agresivo arriba.
        # "expires -1" pone Cache-Control: no-cache sin add_header, así este
        # location conserva las cabeceras de seguridad del server.
        expires -1;
    }

    # El nombre "backend" se resuelve en cada petición con el DNS interno de
    # Docker (127.0.0.11), y no una sola vez al arrancar: si el contenedor del
    # backend se recrea con otra IP (un despliegue solo del backend), nginx
    # seguía mandando a la vieja y respondía 502 hasta reiniciarlo. Además,
    # nginx arranca aunque el backend todavía no esté. La variable va aquí, en el
    # server, porque "set" no pasa a los location anidados (el de los envíos).
    set $api http://backend:8000;

    # El 413 de nginx, en JSON como los del backend: el formulario muestra el motivo
    # (la página HTML de nginx salía como un error sin explicación).
    location @cuerpo_demasiado_grande {
        default_type application/json;
        return 413 '{"detail":"El envío supera el máximo permitido. Cada archivo puede pesar hasta 2 MB."}';
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        # Sin barra final ni ruta: el backend enruta bajo /api/v1/..., así que la
        # URI debe llegarle completa (con "http://backend:8000/" nginx recortaría
        # el prefijo /api y todo daría 404).
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Se REEMPLAZA (no se agrega a lo que mande el cliente): el backend
        # confía en esta cabecera (--forwarded-allow-ips="*") y con
        # $proxy_add_x_forwarded_for un cliente podía inventarse la IP, saltarse
        # el rate limit del login y falsear la bitácora. Si algún día hay otro
        # proxy delante de este nginx, configurar aquí set_real_ip_from y
        # real_ip_header para que $remote_addr siga siendo el cliente real.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout   300s;
        proxy_send_timeout   300s;

        # Tope del cuerpo, el mismo del backend (TopeDelCuerpo en main.py; lo compara
        # tests/test_recursos.py). La API recibe JSON de pocos KB: 1 MB. Antes eran
        # 200 MB para todo /api/, también para el login: cualquiera, sin cuenta, podía
        # hacer que nginx y el backend leyeran 200 MB por petición.
        client_max_body_size 1m;
        error_page 413 @cuerpo_demasiado_grande;

        # Crear (POST /api/v1/solicitudes) y corregir (PUT /api/v1/solicitudes/{id})
        # llevan juntos todos los archivos de la solicitud, de hasta 2 MB cada uno: como
        # mucho 30 pasajeros × 4 documentos + 2 de la solicitud + 20 adicionales = 142
        # archivos (284 MB), más 1 MB de datos (TOPE_CUERPO_ENVIO_MB en solicitud_service.py).
        location ~ ^/api/v1/solicitudes(/[0-9]+)?$ {
            proxy_pass $api;
            client_max_body_size 285m;
        }
    }
}
